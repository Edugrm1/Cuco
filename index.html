<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f24">
<title>Para ti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0a0f24;
  --cream:#fff1dc;
  --ember:#ffb46b;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--night);color:var(--cream);overflow:hidden}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased;touch-action:manipulation}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

/* Portada */
#cover{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:2rem;
  background:radial-gradient(ellipse at 50% 42%,rgba(10,15,36,.78),rgba(10,15,36,.4) 62%,rgba(10,15,36,0) 100%);
  transition:opacity 1.4s ease,visibility 0s 1.4s}
#cover.gone{opacity:0;visibility:hidden;pointer-events:none}
#cover h1{font-family:var(--serif);font-weight:300;font-style:italic;font-size:clamp(2.4rem,10vw,4rem);line-height:1.08;font-variation-settings:"opsz" 144}
#cover p{margin-top:1rem;font-size:1rem;color:rgba(255,241,220,.8)}
#cover .btn{margin-top:2.2rem}

/* Botones */
.btn{font:500 .95rem/1 var(--sans);color:var(--cream);background:rgba(10,15,36,.55);border:1px solid rgba(255,241,220,.4);
  border-radius:999px;padding:.85rem 1.5rem;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  transition:border-color .25s ease,background .25s ease}
.btn:hover{border-color:rgba(255,241,220,.85);background:rgba(10,15,36,.75)}
.btn:focus-visible{outline:2px solid var(--ember);outline-offset:3px}
.btn.big{font-size:1.05rem;padding:1rem 2.2rem;box-shadow:0 0 44px rgba(255,180,107,.22)}

/* Etiquetas de las dos ciudades y contador */
.place{position:fixed;font-size:.82rem;letter-spacing:.02em;color:rgba(255,241,220,.85);transform:translate(-50%,-100%);
  white-space:nowrap;pointer-events:none;opacity:0;text-shadow:0 0 12px rgba(10,15,36,.95)}
#km{position:fixed;left:50%;transform:translate(-50%,-100%);text-align:center;opacity:0;pointer-events:none;text-shadow:0 0 18px rgba(10,15,36,.9)}
#km .num{font-family:var(--serif);font-weight:300;font-size:clamp(2rem,9vw,3rem);line-height:1;font-variant-numeric:tabular-nums;font-variation-settings:"opsz" 144}
#km .cap{margin-top:.4rem;font-size:.85rem;color:rgba(255,241,220,.78)}

/* Mensaje final */
#message{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 5vh);transform:translateX(-50%);
  width:min(88vw,30rem);max-height:44vh;overflow-y:auto;text-align:center;scrollbar-width:none;
  text-shadow:0 0 26px rgba(10,15,36,.95),0 0 8px rgba(10,15,36,.8);pointer-events:none}
#message::-webkit-scrollbar{display:none}
#message.on{pointer-events:auto}
#message h2{font-family:var(--serif);font-weight:300;font-style:italic;font-size:clamp(2.1rem,8vw,3.4rem);line-height:1.1;letter-spacing:-.01em;font-variation-settings:"opsz" 144}
#message p{font-family:var(--serif);font-weight:300;font-size:clamp(1.02rem,3.6vw,1.2rem);line-height:1.65;margin-top:.75em;color:rgba(255,241,220,.93)}
#message .sign{font-style:italic;margin-top:1.2em;color:rgba(255,241,220,.8)}
#message .line{opacity:0;filter:blur(6px);transition:opacity 1.8s ease,filter 1.8s ease;transition-delay:calc(var(--i) * 1.1s)}
#message.on .line{opacity:1;filter:none}
#message.instant .line{transition:none}

/* Controles inferiores */
#controls{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:.7rem;opacity:0;pointer-events:none;transition:opacity 1.4s ease}
#controls.show{opacity:1;pointer-events:auto}
#hint{font-size:.85rem;color:rgba(255,241,220,.85);text-shadow:0 0 10px rgba(6,8,20,.95);transition:opacity 1.2s ease}
#hint.hide{opacity:0}
#controls{width:min(92vw,28rem);text-align:center}
#progress{min-height:1.1em;font-size:.82rem;font-variant-numeric:tabular-nums;color:rgba(255,241,220,.92);text-shadow:0 0 10px rgba(6,8,20,.95)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 132px);transform:translateX(-50%);width:min(86vw,26rem);
  text-align:center;font-family:var(--serif);font-style:italic;font-weight:300;font-size:1.2rem;line-height:1.4;
  text-shadow:0 0 18px rgba(6,8,20,.95),0 0 6px rgba(6,8,20,.9);opacity:0;transition:opacity .8s ease;pointer-events:none}
#toast.on{opacity:1}

#sound{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;font-size:.85rem;padding:.6rem 1rem;display:none}
#sound.show{display:block}

#veil{position:fixed;inset:0;background:#060814;opacity:0;pointer-events:none;transition:opacity .7s ease}
#veil.on{opacity:1;pointer-events:auto}

@media (prefers-reduced-motion:reduce){
  #cover{transition-duration:.01s}
}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>

<div class="place" id="placeA"></div>
<div class="place" id="placeB"></div>
<div id="km" aria-hidden="true"><div class="num"><span id="kmNum"></span> km</div><div class="cap" id="kmCap"></div></div>

<div id="message" aria-live="polite"></div>
<div id="toast" aria-live="polite"></div>

<div id="controls">
  <div id="progress"></div>
  <div id="hint"></div>
  <button class="btn" id="replay" type="button"></button>
</div>

<button class="btn" id="sound" type="button" aria-pressed="false"></button>

<div id="cover" role="dialog" aria-labelledby="coverTitle">
  <div>
    <h1 id="coverTitle"></h1>
    <p id="coverSub"></p>
    <button class="btn big" id="openBtn" type="button"></button>
  </div>
</div>

<div id="veil"></div>

<script>
/* ==========================================================
   AQUÍ CAMBIAS LOS TEXTOS. Todo lo demás puede quedarse igual.
   ========================================================== */
const CONFIG = {
  pageTitle: "Para ti",

  // Portada (lo primero que ve)
  coverTitle: "Jelouu",
  coverButton: "Abrir",

  // Las dos ciudades (a la izquierda sale el avión, a la derecha aterriza)
  fromLabel: "Durango",
  toLabel: "Phoenix, Arizona",

  // Contador de distancia. Pon 0 para ocultarlo.
  distanceKm: 1272,
  kmCaption: "En camino",
  kmArrivedCaption: "Entregado!!",

  // Mensaje final: cada línea aparece una tras otra
  title: "Para ti, Cindy",
  lines: [
    "Quería mandarte algo diferente hoy.",
    "No hay un motivo especial, solo recordarte que te aprecio mucho.",
    "Ojalá te saque una sonrisa (y que no se te olvide regar las flores de abajo)."
  ],
  signature: "— Manuelito",

  replayButton: "Volver a volar",
  hint: "Mantén presionado para regar · toca el cielo para pedir un deseo",
  wishText: "Pide un deseo",
  progressLabel: "Flores regadas",
  wateredMessage: "¡Mira cómo se pusieron! Gracias por cuidarlas.",
  finaleMessage: "Todo el jardín floreció",        // cuando riega casi todas las flores
  finaleSub: "Gracias por cuidarlo",
  specialStarText: "Esa estrella es especial. Pide un deseo.",   // la primera vez que pasa la estrella especial
  catchText: "¡La atrapaste! Tu deseo ya va en camino.",         // si la toca mientras pasa

  // MÚSICA: copia tu canción (mp3) en la misma carpeta que index.html y pon su nombre aquí.
  // Sin espacios ni acentos en el nombre. Ejemplo: "cancion.mp3". Déjalo vacío ("") para no usar música.
  audioSrc: "cuco.mp3",
  audioVolume: 0.7,   // de 0 (nada) a 1 (máximo)
  audioStart: 0,      // segundo de la canción donde empieza (ej. 32 para saltarte la intro)
  soundOn: "Activar música",
  soundOff: "Silenciar música",

  flightSeconds: 9
};

(() => {
  const C = CONFIG;
  const $ = id => document.getElementById(id);
  const TAU = Math.PI * 2;
  const cv = $('sky'), ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
  const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
  const easeInOutSine = t => -(Math.cos(Math.PI * t) - 1) / 2;
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const rnd = mulberry32(20260929);

  /* ---------- textos en el DOM ---------- */
  document.title = C.pageTitle;
  $('coverTitle').textContent = C.coverTitle;
  $('coverSub').textContent = C.coverSub || '';
  $('openBtn').textContent = C.coverButton;
  $('placeA').textContent = C.fromLabel;
  $('placeB').textContent = C.toLabel;
  $('kmCap').textContent = C.kmCaption;
  $('hint').textContent = C.hint;
  $('replay').textContent = C.replayButton;

  const msg = $('message');
  (function buildMessage() {
    const h = document.createElement('h2');
    h.className = 'line'; h.style.setProperty('--i', 0); h.textContent = C.title;
    msg.appendChild(h);
    C.lines.forEach((t, i) => {
      const p = document.createElement('p');
      p.className = 'line'; p.style.setProperty('--i', i + 1); p.textContent = t;
      msg.appendChild(p);
    });
    if (C.signature) {
      const s = document.createElement('p');
      s.className = 'line sign'; s.style.setProperty('--i', C.lines.length + 1); s.textContent = C.signature;
      msg.appendChild(s);
    }
  })();

  /* ---------- geometría ---------- */
  let W = 0, H = 0, DPR = 1, u = 1, hy = 0, apexY = 0;
  let A = { x: 0, y: 0 }, B = { x: 0, y: 0 }, Cp = { x: 0, y: 0 };
  let skyGrad, groundGrad;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    u = clamp(Math.min(W, H * 0.62) / 390, 0.72, 1.5);
    hy = H * 0.70;

    const side = W > H ? 0.2 : 0.08;
    A = { x: W * side, y: hy - 8 * u };
    B = { x: W * (1 - side), y: hy - 8 * u };
    const span = B.x - A.x;
    const apexH = Math.min(0.17 * H, 0.4 * span);
    apexY = A.y - apexH;
    Cp = { x: W / 2, y: 2 * apexY - A.y };

    skyGrad = ctx.createLinearGradient(0, 0, 0, hy + 10);
    skyGrad.addColorStop(0, '#060a1c');
    skyGrad.addColorStop(0.5, '#101843');
    skyGrad.addColorStop(0.8, '#2b1f52');
    skyGrad.addColorStop(0.95, '#6b3a63');
    skyGrad.addColorStop(1, '#b8586c');
    groundGrad = ctx.createLinearGradient(0, hy - 20 * u, 0, H);
    groundGrad.addColorStop(0, '#1d1a3c');
    groundGrad.addColorStop(0.35, '#0d1024');
    groundGrad.addColorStop(1, '#04050d');
    positionDOM();
  }

  function positionDOM() {
    const pa = $('placeA'), pb = $('placeB'), km = $('km');
    pa.style.left = A.x + 'px'; pa.style.top = (A.y - 30 * u) + 'px';
    pb.style.left = B.x + 'px'; pb.style.top = (B.y - 30 * u) + 'px';
    km.style.top = (apexY - 46 * u) + 'px';
  }

  const qp = t => ({
    x: (1 - t) * (1 - t) * A.x + 2 * (1 - t) * t * Cp.x + t * t * B.x,
    y: (1 - t) * (1 - t) * A.y + 2 * (1 - t) * t * Cp.y + t * t * B.y
  });
  const qa = t => Math.atan2(
    2 * (1 - t) * (Cp.y - A.y) + 2 * t * (B.y - Cp.y),
    2 * (1 - t) * (Cp.x - A.x) + 2 * t * (B.x - Cp.x)
  );

  /* ---------- estrellas, pueblitos, luciérnagas ---------- */
  const stars = Array.from({ length: 150 }, () => ({
    x: rnd(), y: rnd() * 0.68, r: rnd() * 1.2 + 0.35, ph: rnd() * TAU, sp: 0.4 + rnd() * 1.1
  }));
  const towns = [0, 1].map(() => Array.from({ length: 16 }, () => ({
    dx: (rnd() - 0.5) * 64, dy: rnd() * 5 - 1, ph: rnd() * TAU, a: 0.35 + rnd() * 0.5
  })));
  const flies = Array.from({ length: 26 }, () => ({
    x: rnd(), y: rnd(), ph: rnd() * TAU, sp: 0.6 + rnd() * 0.9
  }));

  /* ---------- flores ---------- */
  const TYPES = ['peony', 'peony', 'peony', 'daisy', 'sun', 'nomeolvides', 'nomeolvides'];
  const PEONY = [
    ['#f4a3b5', '#ffd0da', '#ffe9c7'],
    ['#ff8a8a', '#ffb3a7', '#ffe1b8'],
    ['#fff1dc', '#ffe0cf', '#ffd166'],
    ['#e58fb0', '#f7c1d6', '#fff0dc']
  ];
  const DAISY = [['#fff7ea', '#ffc23d'], ['#e6dcff', '#ffd166'], ['#ffe7f0', '#ffb703']];
  const GREENS = ['#2d6a44', '#3a8a55', '#245a3a'];
  const GRASS = ['#1d4d3b', '#2a6a4c', '#3b8a5c'];
  const PETAL_COLORS = ['#f4a3b5', '#ffd0da', '#fff1dc', '#c9b6ff', '#ffc0a8'];

  function makeFlower(i, nx, depth, type) {
    let pal = null;
    if (type === 'peony') pal = PEONY[(rnd() * PEONY.length) | 0];
    else if (type === 'daisy') pal = DAISY[(rnd() * DAISY.length) | 0];
    return {
      i, nx, depth, type, pal,
      hr: rnd(), rr: rnd(), curve: rnd() * 2 - 1, phase: rnd() * TAU,
      jit: 0.8 + rnd() * 0.5, gi: (rnd() * 3) | 0, rot: rnd() * TAU, born: null, wet: 0, wv: 0, glow: 0
    };
  }
  let flowers = [];
  for (let i = 0; i < 300; i++) {
    flowers.push(makeFlower(i, rnd() * 1.06 - 0.03, rnd(), TYPES[(rnd() * TYPES.length) | 0]));
  }
  flowers.sort((a, b) => a.depth - b.depth);

  const blades = Array.from({ length: 900 }, (_, i) => ({
    i, nx: rnd() * 1.04 - 0.02, depth: rnd(), h: 12 + rnd() * 26, lean: rnd() * 2 - 1,
    ph: rnd() * TAU, gi: (rnd() * 3) | 0
  })).sort((a, b) => a.depth - b.depth);

  function place(f) {
    const px = f.nx * W;
    const base = hy + (H - hy) * (0.06 + f.depth * 0.9);
    const sc = 0.55 + f.depth * 0.85;
    let stemH = (0.10 + f.hr * 0.20) * H * (0.55 + f.depth * 0.75);
    if (f.type === 'nomeolvides') stemH *= 0.55;
    return { px, base, sc, stemH };
  }

  function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
  function ring(n, d, rad, rot, color) {
    ctx.fillStyle = color; ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const a = rot + i / n * TAU, x = Math.cos(a) * d, y = Math.sin(a) * d;
      ctx.moveTo(x + rad, y); ctx.arc(x, y, rad, 0, TAU);
    }
    ctx.fill();
  }
  function petals(n, d, rx, ry, rot, color) {
    ctx.fillStyle = color; ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const a = rot + i / n * TAU, x = Math.cos(a) * d, y = Math.sin(a) * d;
      ctx.moveTo(x + Math.cos(a) * rx, y + Math.sin(a) * rx);
      ctx.ellipse(x, y, rx, ry, a, 0, TAU);
    }
    ctx.fill();
  }

  function drawHead(f, r) {
    const rot = f.rot;
    if (f.type === 'peony') {
      ring(8, r * 0.58, r * 0.44, rot, f.pal[0]);
      ring(6, r * 0.34, r * 0.36, rot + 0.5, f.pal[1]);
      ctx.fillStyle = f.pal[2]; circ(0, 0, r * 0.24);
    } else if (f.type === 'daisy') {
      petals(12, r * 0.62, r * 0.42, r * 0.15, rot, f.pal[0]);
      ctx.fillStyle = f.pal[1]; circ(0, 0, r * 0.27);
    } else if (f.type === 'sun') {
      petals(8, r * 0.72, r * 0.4, r * 0.14, rot, '#ff9f1c');
      petals(8, r * 0.72, r * 0.4, r * 0.14, rot + TAU / 16, '#ffc93c');
      ctx.fillStyle = '#5a3419'; circ(0, 0, r * 0.42);
      ctx.fillStyle = '#7a4a25'; circ(0, 0, r * 0.24);
    } else {
      ring(5, r * 0.5, r * 0.44, rot, '#8fb8ff');
      ctx.fillStyle = '#ffe38a'; circ(0, 0, r * 0.22);
    }
  }

  function drawFlower(f, bt, now) {
    const { px, base, sc, stemH } = place(f);
    const g = easeOutCubic(clamp(bt / 0.7));
    if (g <= 0.002) return;
    const hb = clamp((bt - 0.3) / 0.7);
    const wv = f.wv || 0;
    const hh = stemH * g * (1 + 0.14 * wv);
    const sw = (Math.sin(now * 0.0011 + f.phase) * 0.035 + Math.sin(now * 0.0005 + f.nx * 5) * 0.03) * hh * (reduce ? 0.2 : 1);
    const cx = px + f.curve * stemH * 0.22 * g + sw * 0.5, cy = base - hh * 0.5;
    const tx = px + f.curve * stemH * 0.08 * g + sw, ty = base - hh;

    ctx.globalAlpha = 0.7 + 0.3 * f.depth;
    ctx.strokeStyle = GREENS[f.gi];
    ctx.lineWidth = (1.4 + f.rr * 0.9) * u * (0.6 + f.depth * 0.6);
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(px, base); ctx.quadraticCurveTo(cx, cy, tx, ty); ctx.stroke();

    if (g > 0.45) {
      const lg = clamp((g - 0.45) / 0.55), t1 = 0.38, m = 1 - t1;
      const lx = m * m * px + 2 * m * t1 * cx + t1 * t1 * tx;
      const ly = m * m * base + 2 * m * t1 * cy + t1 * t1 * ty;
      const side = f.curve > 0 ? -1 : 1;
      const L = (10 + f.rr * 6) * u * sc * lg;
      ctx.fillStyle = GREENS[(f.gi + 1) % 3];
      ctx.beginPath(); ctx.ellipse(lx + side * L * 0.55, ly - L * 0.15, L * 0.62, L * 0.2, -side * 0.5, 0, TAU); ctx.fill();
    }

    const hs = easeOutBack(hb);
    if (hs > 0.01) {
      let r = (9 + f.rr * 9) * u * sc;
      if (f.type === 'nomeolvides') r *= 0.55;
      ctx.save();
      ctx.translate(tx, ty);
      ctx.rotate((sw / Math.max(20, stemH)) * 1.4 + f.curve * 0.12);
      ctx.scale(hs * (1 + 0.42 * wv), hs * (1 + 0.42 * wv));
      if (f.glow > 0.02) { ctx.fillStyle = `rgba(255,228,175,${0.2 * f.glow})`; circ(0, 0, r * (1.5 + 0.5 * f.glow)); }
      drawHead(f, r);
      if (wv > 0.45) { ctx.fillStyle = 'rgba(225,243,255,.9)'; circ(r * 0.22, -r * 0.32, r * 0.09); circ(-r * 0.3, r * 0.1, r * 0.06); }
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function drawBlades(from, to, waveX, n, now) {
    ctx.lineCap = 'round';
    for (const b of blades) {
      if (b.i >= n || b.depth < from || b.depth >= to) continue;
      const x = b.nx * W;
      const gr = 0.25 + 0.75 * clamp((waveX - x + 0.05 * W) / (0.18 * W));
      const base = hy + (H - hy) * (0.02 + b.depth * 0.97);
      const hh = b.h * u * (0.5 + b.depth * 1.0) * gr;
      const sw = Math.sin(now * 0.0013 + b.ph + b.nx * 6) * hh * 0.08 * (reduce ? 0.2 : 1);
      ctx.strokeStyle = GRASS[b.gi];
      ctx.globalAlpha = 0.75 + 0.25 * b.depth;
      ctx.lineWidth = (1 + b.depth * 1.2) * u;
      ctx.beginPath(); ctx.moveTo(x, base);
      ctx.quadraticCurveTo(x + b.lean * hh * 0.35, base - hh * 0.6, x + b.lean * hh * 0.5 + sw, base - hh);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  /* ---------- partículas ---------- */
  const parts = [];   // estela y chispas
  const fall = [];    // pétalos que caen del avión

  /* ---------- riego, mariposas y estrellas fugaces ---------- */
  let nFlowersNow = 300;
  const drops = [];
  const butterflies = [];
  const shooters = [];
  const BFLY = [['#ffb3c7', '#ff8fb0'], ['#ffd166', '#ffb347'], ['#b9a4ff', '#8f7bff'], ['#9fe3ff', '#6cc6ff'], ['#fff1dc', '#f4a3b5']];
  const ptr = { down: false, x: 0, y: 0, t: 0, sx: 0, sy: 0, moved: 0, can: 0 };
  const sparks = [];
  const lanterns = [];
  let finaleDone = false, finaleGlow = 0, special = null, nextSpecial = 0, specialSeen = false;
  let pourAcc = 0, progress = 0, progTick = 0, celebrated = false, nextShooter = 0, toastTimer = 0;

  function showToast(text, ms) {
    const el = $('toast');
    el.textContent = text; el.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('on'), ms || 3200);
  }
  const groundY = y => clamp(y, hy + 8 * u, H - 6 * u);

  function wetAt(x, gy) {
    for (const f of flowers) {
      if (f.born === null && f.i >= nFlowersNow) continue;
      const p = place(f);
      if (Math.abs(p.px - x) < 38 * u * (0.6 + p.sc * 0.5) && Math.abs(p.base - gy) < 30 * u) {
        f.wet = Math.min(1, f.wet + 0.07); f.glow = 1;
      }
    }
  }
  function calcProgress() {
    let n = 0, w = 0;
    for (const f of flowers) {
      if (f.born !== null || f.i >= nFlowersNow) continue;
      const fx = f.nx * W;
      if (fx < 4 || fx > W - 4) continue;
      n++; if (f.wet >= 0.5) w++;
    }
    return n ? w / n : 0;
  }
  function pickTarget(b) {
    const wet = flowers.filter(f => f.wv > 0.4 && (f.born !== null || f.i < nFlowersNow));
    if (wet.length && rnd() < 0.75) {
      const f = wet[(rnd() * wet.length) | 0], p = place(f);
      b.tx = p.px + (rnd() - 0.5) * 20 * u; b.ty = p.base - p.stemH * 1.05 - 6 * u;
    } else {
      b.tx = rnd() * W; b.ty = hy - 0.2 * H + rnd() * 0.45 * H;
    }
  }
  function spawnButterfly() {
    const b = { x: rnd() < 0.5 ? -20 : W + 20, y: hy - rnd() * 0.3 * H, tx: 0, ty: 0, t: 0, ph: rnd() * TAU, c: BFLY[(rnd() * BFLY.length) | 0] };
    pickTarget(b); b.t = 1.6 + rnd() * 2.2;
    butterflies.push(b);
  }
  function spawnShooter(x, y) {
    const dir = rnd() < 0.5 ? -1 : 1;
    shooters.push({ x, y, vx: dir * (320 + rnd() * 120) * u, vy: (130 + rnd() * 60) * u, age: 0, life: 1.1 });
  }
  function plantFlower(x, y) {
    const d = clamp(((y - hy) / (H - hy) - 0.06) / 0.9);
    const f = makeFlower(0, x / W, d, TYPES[(Math.random() * TYPES.length) | 0]);
    f.hr = 0.35 + rnd() * 0.5; f.born = performance.now();
    flowers.push(f);
    flowers.sort((a, b) => a.depth - b.depth);
    const planted = flowers.filter(q => q.born !== null);
    if (planted.length > 40) flowers.splice(flowers.indexOf(planted[0]), 1);
    for (let k = 0; k < 8; k++) {
      emit(x + (rnd() - 0.5) * 16, y, (rnd() - 0.5) * 30, -20 - rnd() * 34, 1.1 + rnd() * 0.8, (1.2 + rnd() * 1.4) * u, '#ffe6b0');
    }
  }


  function star4(x, y, R, rot) {
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = rot + i * Math.PI / 4, r = i % 2 ? R * 0.24 : R;
      const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
      if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
    }
    ctx.closePath(); ctx.fill();
  }
  function pushSpark(o) { if (sparks.length > 900) sparks.shift(); sparks.push(o); }
  const GLIT = ['255,241,220', '255,209,140', '255,179,209', '210,190,255'];
  function addGlit(x, y, v) {
    const sp = v || 14;
    pushSpark({ kind: 'g', x, y, vx: (rnd() - 0.5) * sp * u, vy: (rnd() - 0.5) * sp * u + 8 * u, g: 8 * u, drag: 0.99,
      age: 0, life: 1.1 + rnd() * 0.9, r: (1.6 + rnd() * 2.4) * u, c: GLIT[(rnd() * GLIT.length) | 0] });
  }
  function fireworkAt(x, y, rgb) {
    for (let ring = 0; ring < 2; ring++) {
      const n = ring ? 22 : 40, sp = (ring ? 85 : 150) * u;
      for (let i = 0; i < n; i++) {
        const a = i / n * TAU + rnd() * 0.15, v = sp * (0.8 + rnd() * 0.4);
        pushSpark({ kind: 'l', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 55 * u, drag: 0.978,
          age: 0, life: 1.5 + rnd() * 0.7, r: 1.7 * u, c: ring ? '255,241,220' : rgb });
      }
    }
  }
  function spawnLantern() {
    lanterns.push({ x: W * (0.08 + rnd() * 0.84), y: hy + (H - hy) * (0.15 + rnd() * 0.8), vy: -(22 + rnd() * 16) * u,
      ph: rnd() * TAU, s: (7 + rnd() * 5) * u, age: 0 });
  }
  function spawnSpecial() {
    const dir = rnd() < 0.5 ? 1 : -1;
    special = {
      x0: dir > 0 ? -30 * u : W + 30 * u, x1: dir > 0 ? W + 30 * u : -30 * u,
      y0: hy * (0.3 + rnd() * 0.1), y1: hy * (0.42 + rnd() * 0.12), arc: hy * 0.12,
      age: 0, life: 5.2, x: 0, y: 0, rot: 0, trail: []
    };
    special.x = special.x0; special.y = special.y0;
  }
  const FIRE_COLS = ['255,179,199', '255,209,102', '185,164,255', '159,227,255', '255,241,220'];
  function startFinale(now) {
    finaleDone = true; finaleGlow = 1;
    progress = 100; $('progress').textContent = C.progressLabel + ': 100%';
    for (const f of flowers) if (f.born === null) f.bloomAt = now + 200 + f.nx * 2200;
    for (let k = 0; k < 70; k++) {
      fall.push({ x: rnd() * W, y: hy + rnd() * (H - hy), vx: (rnd() - 0.5) * 16, vy: -(26 + rnd() * 46),
        rot: rnd() * TAU, vr: (rnd() - 0.5) * 3, seed: rnd() * TAU, age: 0, life: 6 + rnd() * 3,
        sz: (3.2 + rnd() * 3) * u, color: PETAL_COLORS[(rnd() * PETAL_COLORS.length) | 0] });
    }
    showToast(C.finaleMessage, 4800);
    timers.push(setTimeout(() => showToast(C.finaleSub, 6500), 5200));
    for (let k = 0; k < 8; k++) {
      timers.push(setTimeout(() => fireworkAt(W * (0.15 + rnd() * 0.7), H * (0.07 + rnd() * 0.3), FIRE_COLS[k % FIRE_COLS.length]), 300 + k * 750));
    }
    for (let k = 0; k < 14; k++) timers.push(setTimeout(spawnLantern, 1200 + k * 420));
  }

  function drawButterfly(b, now) {
    const fl = 0.3 + 0.7 * Math.abs(Math.sin(now * 0.016 + b.ph));
    ctx.save(); ctx.translate(b.x, b.y); ctx.scale(1.25, 1.25);
    ctx.globalAlpha = 0.95;
    ctx.fillStyle = b.c[1];
    ctx.beginPath(); ctx.ellipse(-3.2 * u * fl, 3 * u, 3.4 * u * fl, 2.6 * u, 0.5, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(3.2 * u * fl, 3 * u, 3.4 * u * fl, 2.6 * u, -0.5, 0, TAU); ctx.fill();
    ctx.fillStyle = b.c[0];
    ctx.beginPath(); ctx.ellipse(-4.4 * u * fl, -1.5 * u, 4.6 * u * fl, 3.6 * u, -0.45, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(4.4 * u * fl, -1.5 * u, 4.6 * u * fl, 3.6 * u, 0.45, 0, TAU); ctx.fill();
    ctx.fillStyle = '#3a2b4d'; ctx.fillRect(-0.7 * u, -4 * u, 1.4 * u, 9 * u);
    ctx.restore();
  }

  function drawCan(px, gy, k, now) {
    const a = 0.35 * k + Math.sin(now * 0.012) * 0.02 * k, s = 1.15 * u;
    const tipX = px, tipY = gy - 80 * u - (1 - k) * 18 * u;
    const vx = (32 * Math.cos(a) + 15 * Math.sin(a)) * s, vy = (32 * Math.sin(a) - 15 * Math.cos(a)) * s;
    ctx.save();
    ctx.translate(tipX - vx, tipY - vy); ctx.rotate(a); ctx.scale(s, s);
    ctx.globalAlpha = k;
    ctx.shadowColor = 'rgba(150,210,255,.55)'; ctx.shadowBlur = 14;
    ctx.fillStyle = '#9ccfe3';
    ctx.fillRect(-16, -11, 32, 22);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#d7f0fa'; ctx.fillRect(-16, -11, 32, 4);
    ctx.strokeStyle = '#9ccfe3'; ctx.lineCap = 'round';
    ctx.lineWidth = 4.5; ctx.beginPath(); ctx.moveTo(14, -1); ctx.lineTo(30, -13); ctx.stroke();
    ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(-16, 0, 9, Math.PI * 0.5, Math.PI * 1.5); ctx.stroke();
    ctx.fillStyle = '#d7f0fa'; ctx.beginPath(); ctx.ellipse(31, -14, 3.4, 5, -0.6, 0, TAU); ctx.fill();
    ctx.restore();
  }

  function emit(x, y, vx, vy, life, r, color) {
    if (parts.length > 340) parts.shift();
    parts.push({ x, y, vx, vy, life, age: 0, r, color });
  }
  function burst(x, y) {
    for (let k = 0; k < 44; k++) {
      const a = rnd() * TAU, s = (20 + rnd() * 70) * u;
      emit(x, y, Math.cos(a) * s, Math.sin(a) * s, 1.3 + rnd() * 1, (1.4 + rnd() * 1.6) * u,
        k % 3 === 0 ? '#f4a3b5' : '#ffe6b0');
    }
  }

  /* ---------- estado ---------- */
  let state = 'cover';       // cover | flying | arrived
  let tOpen = 0, t0 = 0, tArr = 0;
  let intro = 0, arrivedAmt = 0, planeP = 0, waveN = -0.2, lastPetal = 0, lastKm = -1;
  let timers = [];
  let audio = null;

  function begin() {
    state = 'flying';
    tOpen = performance.now();
    t0 = tOpen + 1500;
    planeP = 0; arrivedAmt = 0; intro = 0; waveN = -0.2; lastKm = -1;
    $('kmCap').textContent = C.kmCaption;
  }

  function showMessage(instant) {
    if (instant) msg.classList.add('instant');
    msg.classList.add('on');
  }
  function showControls() {
    $('controls').classList.add('show');
    $('hint').classList.remove('hide');
    timers.push(setTimeout(() => $('hint').classList.add('hide'), 8000));
  }

  function arrive(now) {
    state = 'arrived'; tArr = now; planeP = 1; nextShooter = now + 6000; nextSpecial = now + 12000;
    burst(B.x, B.y);
    $('kmCap').textContent = C.kmArrivedCaption;
    timers.push(setTimeout(() => showMessage(false), 1800));
    timers.push(setTimeout(showControls, 1800 + (C.lines.length + 2) * 1100));
  }

  function start() {
    $('cover').classList.add('gone');
    playMusic();
    begin();
  }

  function replay() {
    timers.forEach(clearTimeout); timers = [];
    ptr.down = false;
    $('controls').classList.remove('show');
    msg.classList.remove('on', 'instant');
    $('veil').classList.add('on');
    timers.push(setTimeout(() => {
      flowers = flowers.filter(f => f.born === null);
      flowers.forEach(f => { f.wet = 0; f.wv = 0; f.glow = 0; f.bloomAt = 0; });
      parts.length = 0; fall.length = 0; drops.length = 0; butterflies.length = 0; shooters.length = 0; sparks.length = 0; lanterns.length = 0; special = null;
      celebrated = false; finaleDone = false; finaleGlow = 0; progress = 0; $('progress').textContent = '';
      $('toast').classList.remove('on');
      begin();
      $('veil').classList.remove('on');
    }, 750));
  }

  /* ---------- actualización ---------- */
  function update(now, dt) {
    // regadera
    ptr.can = lerp(ptr.can, ptr.down ? 1 : 0, Math.min(1, dt * 8));
    if (ptr.down && state === 'arrived') {
      pourAcc += dt * 75;
      const gy = groundY(ptr.y);
      while (pourAcc >= 1 && drops.length < 220) {
        pourAcc -= 1;
        drops.push({ x: ptr.x + (rnd() - 0.5) * 16 * u, y: gy - 80 * u - rnd() * 14 * u, vy: (260 + rnd() * 90) * u, gy: gy + (rnd() - 0.5) * 10 * u });
      }
      pourAcc = Math.min(pourAcc, 2);
    }
    for (let i = drops.length - 1; i >= 0; i--) {
      const d = drops[i]; d.y += d.vy * dt;
      if (d.y >= d.gy) {
        wetAt(d.x, d.gy);
        for (let k = 0; k < 2; k++) emit(d.x, d.gy, (rnd() - 0.5) * 50, -16 - rnd() * 34, 0.45 + rnd() * 0.3, (0.9 + rnd() * 0.9) * u, '#c4e8ff');
        drops.splice(i, 1);
      }
    }
    for (const f of flowers) {
      if (f.bloomAt && now >= f.bloomAt) { f.bloomAt = 0; f.wet = 1; f.glow = 1; }
      f.wv += (f.wet - f.wv) * Math.min(1, dt * 3);
      if (f.glow > 0) f.glow = Math.max(0, f.glow - dt * 0.7);
    }
    for (const b of butterflies) {
      b.t -= dt;
      if (b.t <= 0) { pickTarget(b); b.t = 1.6 + rnd() * 2.2; }
      const k = Math.min(1, dt * 0.9);
      b.x += (b.tx - b.x) * k + Math.sin(now * 0.004 + b.ph) * 18 * u * dt;
      b.y += (b.ty - b.y) * k + Math.cos(now * 0.0053 + b.ph) * 14 * u * dt;
    }
    for (let i = shooters.length - 1; i >= 0; i--) {
      const q = shooters[i]; q.age += dt; q.x += q.vx * dt; q.y += q.vy * dt;
      if (q.age >= q.life) shooters.splice(i, 1);
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i]; p.age += dt;
      p.vy += p.g * dt;
      const dr = Math.pow(p.drag, dt * 60); p.vx *= dr; p.vy *= dr;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.age >= p.life) sparks.splice(i, 1);
    }
    for (let i = lanterns.length - 1; i >= 0; i--) {
      const l = lanterns[i]; l.age += dt; l.y += l.vy * dt; l.x += Math.sin(l.age * 0.8 + l.ph) * 9 * u * dt;
      if (l.y < -40 * u) lanterns.splice(i, 1);
    }
    finaleGlow = Math.max(0, finaleGlow - dt * 0.16);
    if (special) {
      const sp = special; sp.age += dt;
      const t = clamp(sp.age / sp.life);
      sp.x = lerp(sp.x0, sp.x1, t);
      sp.y = lerp(sp.y0, sp.y1, t) - sp.arc * Math.sin(Math.PI * t);
      sp.rot += dt * 1.2;
      sp.trail.push({ x: sp.x, y: sp.y }); if (sp.trail.length > 70) sp.trail.shift();
      for (let k = 0; k < 2; k++) addGlit(sp.x + (rnd() - 0.5) * 8 * u, sp.y + (rnd() - 0.5) * 8 * u);
      if (t >= 1) special = null;
    }
    if (state === 'arrived') {
      progTick -= dt;
      if (progTick <= 0) {
        progTick = 0.3;
        const p = calcProgress(), pct = Math.round(p * 100);
        if (pct !== progress) {
          progress = pct;
          $('progress').textContent = pct > 0 ? C.progressLabel + ': ' + pct + '%' : '';
        }
        const want = Math.floor(p * 10) + (celebrated ? 2 : 0);
        while (butterflies.length < Math.min(want, 12)) spawnButterfly();
        if (!celebrated && p >= 0.5) {
          celebrated = true;
          showToast(C.wateredMessage, 5200);
          burst(W / 2, hy - 0.12 * H);
          for (let k = 0; k < 3; k++) spawnButterfly();
        }
        if (!finaleDone && p >= 0.95) startFinale(now);
      }
      if (now > nextShooter) {
        spawnShooter(rnd() * W * 0.8 + W * 0.1, rnd() * hy * 0.35 + 10);
        nextShooter = now + 14000 + rnd() * 12000;
      }
      if (now > nextSpecial && !special) {
        spawnSpecial();
        nextSpecial = now + 26000 + rnd() * 20000;
        if (!specialSeen) { specialSeen = true; showToast(C.specialStarText, 3800); }
      }
    }

    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i]; p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.985; p.vy *= 0.985;
      if (p.age >= p.life) parts.splice(i, 1);
    }
    for (let i = fall.length - 1; i >= 0; i--) {
      const p = fall[i]; p.age += dt;
      p.x += (p.vx + Math.sin(p.age * 2 + p.seed) * 16) * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      if (p.age >= p.life || p.y > H) fall.splice(i, 1);
    }
    if (state === 'cover') { intro = 0; return; }
    intro = clamp((now - tOpen) / 1200);

    if (state === 'flying') {
      const tt = clamp((now - t0) / (C.flightSeconds * 1000));
      planeP = easeInOutSine(tt);
      const pos = qp(planeP);
      waveN = lerp(-0.15, 1.25, clamp((pos.x - A.x) / (B.x - A.x)));
      if (tt > 0 && tt < 1) {
        const ang = qa(planeP), back = 22 * u;
        const tx = pos.x - Math.cos(ang) * back, ty = pos.y - Math.sin(ang) * back;
        emit(tx + (rnd() - 0.5) * 3, ty + (rnd() - 0.5) * 3, -Math.cos(ang) * 6 + (rnd() - 0.5) * 8,
          -Math.sin(ang) * 6 + (rnd() - 0.5) * 8 + 4, 1.6 + rnd() * 0.8, (1.2 + rnd() * 1.2) * u, '#fff1dc');
        if (now - lastPetal > 110) {
          lastPetal = now;
          fall.push({
            x: pos.x + (rnd() - 0.5) * 10 * u, y: pos.y + 6 * u, vx: (rnd() - 0.5) * 14, vy: 16 + rnd() * 18,
            rot: rnd() * TAU, vr: (rnd() - 0.5) * 3, seed: rnd() * TAU, age: 0, life: 3.2 + rnd() * 1.6,
            sz: (3.2 + rnd() * 3) * u, color: PETAL_COLORS[(rnd() * PETAL_COLORS.length) | 0]
          });
        }
      }
      if (tt >= 1) arrive(now);
    } else {
      planeP = 1;
      waveN = Math.min(1.9, waveN + dt * 0.55);
      arrivedAmt = clamp((now - tArr) / 2200);
    }

    // contador de km
    if (C.distanceKm > 0) {
      const val = state === 'arrived' ? 0 : Math.round(C.distanceKm * (1 - planeP));
      if (val !== lastKm) { lastKm = val; $('kmNum').textContent = val.toLocaleString('es-MX'); }
      const fade = state === 'arrived' ? 1 - clamp((now - tArr - 2400) / 1000) : 1;
      $('km').style.opacity = String(intro * fade);
    }
    $('placeA').style.opacity = String(intro);
    $('placeB').style.opacity = String(intro);
  }

  /* ---------- dibujo ---------- */
  function drawBeacon(P, rgb, now, k, boost) {
    const pulse = (now % 2600) / 2600;
    const g = ctx.createRadialGradient(P.x, P.y, 0, P.x, P.y, 36 * u * (1 + boost * 0.4));
    g.addColorStop(0, `rgba(${rgb},${0.65 * k})`);
    g.addColorStop(1, `rgba(${rgb},0)`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(P.x, P.y, 36 * u * (1 + boost * 0.4), 0, TAU); ctx.fill();
    ctx.strokeStyle = `rgba(${rgb},${(1 - pulse) * 0.4 * k})`; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(P.x, P.y, (4 + pulse * 30) * u, 0, TAU); ctx.stroke();
    ctx.fillStyle = `rgba(255,241,220,${k})`; circ(P.x, P.y, 3.2 * u);
  }

  function drawPlane(x, y, ang, alpha, now) {
    ctx.save();
    ctx.translate(x, y); ctx.rotate(ang);
    const s = 1.25 * u; ctx.scale(s, s);
    ctx.globalAlpha = alpha;
    ctx.shadowColor = 'rgba(255,190,120,.85)'; ctx.shadowBlur = 16;
    ctx.fillStyle = '#f3e3cb';
    ctx.beginPath(); ctx.moveTo(-11, -2); ctx.lineTo(-17, -9.5); ctx.lineTo(-13, -9.5); ctx.lineTo(-5, -2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff3df';
    ctx.beginPath(); ctx.ellipse(0, 0, 18, 3.6, 0, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#e8d3b4';
    ctx.beginPath(); ctx.moveTo(4, 1.5); ctx.lineTo(-7, 10); ctx.lineTo(-2.5, 10.5); ctx.lineTo(10, 1.5); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(60,50,90,.75)';
    for (let i = 0; i < 5; i++) circ(-7 + i * 3.4, -0.6, 0.8);
    ctx.beginPath(); ctx.ellipse(12.5, -0.9, 2.6, 1.2, 0, 0, TAU); ctx.fill();
    if (Math.sin(now * 0.008) > 0.55) {
      ctx.fillStyle = '#ff6b6b'; ctx.shadowColor = '#ff6b6b'; ctx.shadowBlur = 8;
      circ(-16, -9.5, 1.4);
    }
    ctx.restore();
  }

  function draw(now) {
    ctx.globalAlpha = 1;
    ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, W, H);

    // estrellas
    ctx.fillStyle = '#fff1dc';
    for (const s of stars) {
      ctx.globalAlpha = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(now * 0.001 * s.sp + s.ph));
      ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r * Math.min(1.2, u), 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // estrellas fugaces
    for (const q of shooters) {
      const a = Math.sin(clamp(q.age / q.life) * Math.PI);
      ctx.lineCap = 'round';
      for (let i = 0; i < 14; i++) {
        const t1 = i / 14, t2 = (i + 1) / 14;
        ctx.strokeStyle = `rgba(255,241,220,${a * (1 - t1) * 0.9})`;
        ctx.lineWidth = (2.2 - 1.6 * t1) * u;
        ctx.beginPath();
        ctx.moveTo(q.x - q.vx * 0.12 * t1, q.y - q.vy * 0.12 * t1);
        ctx.lineTo(q.x - q.vx * 0.12 * t2, q.y - q.vy * 0.12 * t2);
        ctx.stroke();
      }
      ctx.fillStyle = `rgba(255,250,235,${a})`; circ(q.x, q.y, 2 * u);
    }

    // estrella especial
    if (special) {
      const sp = special, t = clamp(sp.age / sp.life), a = Math.pow(Math.sin(Math.PI * t), 0.5), n = sp.trail.length;
      ctx.lineCap = 'round';
      for (let i = 1; i < n; i++) {
        const fr = i / n;
        ctx.strokeStyle = `rgba(255,${Math.round(170 + 70 * fr)},${Math.round(205 - 40 * fr)},${a * fr * 0.75})`;
        ctx.lineWidth = (0.6 + 5.4 * fr) * u;
        ctx.beginPath(); ctx.moveTo(sp.trail[i - 1].x, sp.trail[i - 1].y); ctx.lineTo(sp.trail[i].x, sp.trail[i].y); ctx.stroke();
      }
      const R = (12 + 2.5 * Math.sin(now * 0.012)) * u;
      const g = ctx.createRadialGradient(sp.x, sp.y, 0, sp.x, sp.y, R * 3.2);
      g.addColorStop(0, `rgba(255,236,200,${0.85 * a})`); g.addColorStop(1, 'rgba(255,200,160,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sp.x, sp.y, R * 3.2, 0, TAU); ctx.fill();
      ctx.globalAlpha = a;
      ctx.fillStyle = '#ffb3d1'; star4(sp.x, sp.y, R * 0.75, sp.rot + Math.PI / 4);
      ctx.fillStyle = '#fff8ea'; star4(sp.x, sp.y, R, sp.rot);
      ctx.globalAlpha = 1;
    }

    // resplandor del horizonte: crece con las flores
    const bloomAvg = clamp(waveN / 1.2);
    ctx.save();
    ctx.translate(W / 2, hy); ctx.scale(1, 0.5);
    const hg = ctx.createRadialGradient(0, 0, 0, 0, 0, W * 0.75);
    hg.addColorStop(0, `rgba(255,170,110,${0.1 + 0.26 * bloomAvg})`);
    hg.addColorStop(1, 'rgba(255,170,110,0)');
    ctx.fillStyle = hg; ctx.fillRect(-W, -H, W * 2, H * 2);
    ctx.restore();

    // colina
    ctx.fillStyle = groundGrad;
    ctx.beginPath();
    ctx.moveTo(0, H); ctx.lineTo(0, hy + 8 * u);
    ctx.bezierCurveTo(W * 0.3, hy - 14 * u, W * 0.65, hy + 18 * u, W, hy - 4 * u);
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,180,140,0.16)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, hy + 8 * u);
    ctx.bezierCurveTo(W * 0.3, hy - 14 * u, W * 0.65, hy + 18 * u, W, hy - 4 * u); ctx.stroke();

    const waveX = waveN * W;
    nFlowersNow = clamp(Math.round(W / 5), 90, 300);
    const nFlowers = nFlowersNow;
    const nBlades = clamp(Math.round(W / 1.7), 240, 900);

    if (intro > 0) {
      // ruta punteada
      const arcA = lerp(1, 0.15, arrivedAmt);
      ctx.lineCap = 'round';
      ctx.setLineDash([1.5 * u, 8 * u]); ctx.lineWidth = 1.6 * u;
      ctx.strokeStyle = `rgba(255,241,220,${0.3 * intro * arcA})`;
      ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.quadraticCurveTo(Cp.x, Cp.y, B.x, B.y); ctx.stroke();
      if (planeP > 0) {
        ctx.strokeStyle = `rgba(255,205,150,${0.95 * intro * arcA})`;
        ctx.beginPath(); ctx.moveTo(A.x, A.y);
        const steps = 70;
        for (let i = 1; i <= steps; i++) { const p = qp(planeP * i / steps); ctx.lineTo(p.x, p.y); }
        ctx.stroke();
      }
      ctx.setLineDash([]);

      // pueblitos y luces de cada ciudad
      [A, B].forEach((P, k) => {
        for (const d of towns[k]) {
          ctx.fillStyle = `rgba(255,214,150,${d.a * intro * (0.55 + 0.45 * Math.sin(now * 0.0015 + d.ph))})`;
          ctx.fillRect(P.x + d.dx * u, P.y + 4 * u + d.dy * u, 1.6 * u, 1.6 * u);
        }
      });
      drawBeacon(A, '255,180,107', now, intro, 0);
      const mix = arrivedAmt;
      const rgbB = `${Math.round(lerp(143, 255, mix))},${Math.round(lerp(184, 180, mix))},${Math.round(lerp(255, 107, mix))}`;
      drawBeacon(B, rgbB, now, intro, mix);
    }

    drawBlades(0, 0.55, waveX, nBlades, now);

    // flores de atrás hacia adelante
    for (const f of flowers) {
      if (f.born === null && f.i >= nFlowers) continue;
      const bt = f.born !== null
        ? clamp((now - f.born) / 1700)
        : clamp((waveX - f.nx * W) / (0.26 * W * f.jit));
      if (bt > 0) drawFlower(f, bt, now);
    }

    drawBlades(0.55, 1.01, waveX, nBlades, now);

    // final: resplandor, faroles y fuegos artificiales
    if (finaleGlow > 0.01) {
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const fg = ctx.createRadialGradient(W / 2, hy, 0, W / 2, hy, W * 0.8);
      fg.addColorStop(0, `rgba(255,190,120,${0.22 * finaleGlow})`); fg.addColorStop(1, 'rgba(255,190,120,0)');
      ctx.fillStyle = fg; ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
    for (const l of lanterns) {
      const k = clamp(l.age / 1.2) * clamp((l.y + 40 * u) / (0.25 * H));
      const fl = 0.85 + 0.15 * Math.sin(now * 0.01 + l.ph * 3);
      const lg = ctx.createRadialGradient(l.x, l.y, 0, l.x, l.y, l.s * 3.6);
      lg.addColorStop(0, `rgba(255,190,110,${0.5 * k * fl})`); lg.addColorStop(1, 'rgba(255,190,110,0)');
      ctx.fillStyle = lg; ctx.beginPath(); ctx.arc(l.x, l.y, l.s * 3.6, 0, TAU); ctx.fill();
      ctx.globalAlpha = k;
      ctx.fillStyle = '#ffb45e'; ctx.fillRect(l.x - l.s * 0.62, l.y - l.s * 0.8, l.s * 1.24, l.s * 1.6);
      ctx.fillStyle = '#ffe2a8'; ctx.fillRect(l.x - l.s * 0.38, l.y - l.s * 0.55, l.s * 0.76, l.s * 1.1);
      ctx.fillStyle = '#b5652a';
      ctx.fillRect(l.x - l.s * 0.62, l.y - l.s * 0.8, l.s * 1.24, l.s * 0.18);
      ctx.fillRect(l.x - l.s * 0.62, l.y + l.s * 0.62, l.s * 1.24, l.s * 0.18);
      ctx.globalAlpha = 1;
    }
    for (const p of sparks) {
      const k = 1 - p.age / p.life;
      if (p.kind === 'l') {
        ctx.strokeStyle = `rgba(${p.c},${k * k})`; ctx.lineWidth = p.r; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.04, p.y - p.vy * 0.04); ctx.stroke();
      } else {
        ctx.fillStyle = `rgba(${p.c},${k * (0.45 + 0.55 * Math.abs(Math.sin(p.age * 14 + p.r * 9)))})`;
        star4(p.x, p.y, p.r * 1.8, p.age * 2);
      }
    }

    // gotas y mariposas
    if (drops.length) {
      ctx.strokeStyle = 'rgba(190,230,255,.8)'; ctx.lineWidth = 1.5 * u; ctx.lineCap = 'round';
      ctx.beginPath();
      for (const d of drops) { ctx.moveTo(d.x, d.y - 9 * u); ctx.lineTo(d.x, d.y); }
      ctx.stroke();
    }
    for (const b of butterflies) drawButterfly(b, now);

    // estela y chispas
    for (const p of parts) {
      const a = 1 - p.age / p.life;
      ctx.globalAlpha = a * 0.55; ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 + (1 - a) * 1.2), 0, TAU); ctx.fill();
    }
    // pétalos que caen
    for (const p of fall) {
      ctx.globalAlpha = clamp(p.life - p.age, 0, 1) * 0.9;
      ctx.fillStyle = p.color;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.beginPath(); ctx.ellipse(0, 0, p.sz, p.sz * 0.55, 0, 0, TAU); ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;

    if (ptr.can > 0.02) drawCan(ptr.x, groundY(ptr.y), ptr.can, now);

    // avión
    if (intro > 0) {
      const pos = qp(planeP);
      const bob = state === 'flying' && planeP > 0 && planeP < 1 ? Math.sin(now * 0.004) * 1.2 * u : 0;
      const ang = qa(planeP) * 0.9;
      const alpha = intro * (state === 'arrived' ? 1 - clamp((now - tArr) / 1600) : 1);
      if (alpha > 0.01) drawPlane(pos.x, pos.y + bob, ang, alpha, now);
    }

    // luciérnagas
    if (state === 'arrived') {
      const k = clamp((now - tArr) / 2500);
      for (const f of flies) {
        const x = f.x * W + Math.sin(now * 0.0003 * f.sp + f.ph) * 30 * u;
        const y = hy - 0.22 * H + f.y * 0.5 * H + Math.cos(now * 0.00025 * f.sp + f.ph * 2) * 24 * u;
        const b = Math.pow(Math.max(0, Math.sin(now * 0.002 * f.sp + f.ph)), 2);
        const a = k * (0.25 + 0.75 * b);
        ctx.fillStyle = `rgba(255,214,140,${a * 0.18})`; circ(x, y, 7 * u);
        ctx.fillStyle = `rgba(255,232,180,${a})`; circ(x, y, 2 * u);
      }
    }
  }

  /* ---------- bucle ---------- */
  let last = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - (last || now)) / 1000); last = now;
    update(now, dt); draw(now);
    requestAnimationFrame(frame);
  }

  /* ---------- eventos ---------- */
  $('openBtn').addEventListener('click', start);
  $('replay').addEventListener('click', replay);

  cv.addEventListener('pointerdown', e => {
    if (state !== 'arrived') return;
    if (e.clientY < hy - 6 * u) {
      if (special && Math.hypot(e.clientX - special.x, e.clientY - special.y) < 56 * u) {
        for (let k = 0; k < 46; k++) addGlit(special.x + (rnd() - 0.5) * 10 * u, special.y + (rnd() - 0.5) * 10 * u, 160);
        special = null; showToast(C.catchText, 3600); return;
      }
      spawnShooter(e.clientX - 40 * u, e.clientY); showToast(C.wishText, 2600); return;
    }
    ptr.down = true; ptr.x = ptr.sx = e.clientX; ptr.y = ptr.sy = e.clientY;
    ptr.t = performance.now(); ptr.moved = 0;
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    $('hint').classList.add('hide');
  });
  cv.addEventListener('pointermove', e => {
    if (!ptr.down) return;
    ptr.x = e.clientX; ptr.y = e.clientY;
    ptr.moved = Math.max(ptr.moved, Math.hypot(e.clientX - ptr.sx, e.clientY - ptr.sy));
  });
  const release = e => {
    if (!ptr.down) return;
    ptr.down = false;
    if (e.type === 'pointerup' && performance.now() - ptr.t < 260 && ptr.moved < 12) plantFlower(ptr.sx, ptr.sy);
  };
  cv.addEventListener('pointerup', release);
  cv.addEventListener('pointercancel', release);

  /* ---------- música ---------- */
  const soundBtn = $('sound');
  let fadeId = 0, wantVolume = 0.7;

  function fadeTo(target, ms) {
    if (!audio) return;
    clearInterval(fadeId);
    const from = audio.volume, t0 = performance.now();
    fadeId = setInterval(() => {
      const k = clamp((performance.now() - t0) / ms);
      audio.volume = clamp(lerp(from, target, k));
      if (k >= 1) clearInterval(fadeId);
    }, 50);
  }

  function playMusic() {
    if (!audio) return;
    audio.volume = 0;
    const p = audio.play();
    const ok = () => { soundBtn.classList.add('show'); fadeTo(wantVolume, 3500); };
    if (p && p.then) p.then(ok).catch(() => {}); else ok();
  }

  if (C.audioSrc) {
    wantVolume = clamp(C.audioVolume == null ? 0.7 : C.audioVolume);
    audio = new Audio(C.audioSrc);
    audio.loop = true; audio.preload = 'auto';
    if (C.audioStart > 0) {
      audio.addEventListener('loadedmetadata', () => { try { audio.currentTime = C.audioStart; } catch (e) {} });
      audio.addEventListener('ended', () => { audio.currentTime = C.audioStart; audio.play().catch(() => {}); });
    }
    // si el archivo no existe o no se puede reproducir, se oculta el botón y la página sigue igual
    audio.addEventListener('error', () => { audio = null; soundBtn.classList.remove('show'); });
    soundBtn.textContent = C.soundOff;
    soundBtn.addEventListener('click', () => {
      if (!audio) return;
      audio.muted = !audio.muted;
      soundBtn.textContent = audio.muted ? C.soundOn : C.soundOff;
      soundBtn.setAttribute('aria-pressed', String(audio.muted));
    });
    // pausa cuando sale de la página o apaga la pantalla
    document.addEventListener('visibilitychange', () => {
      if (!audio || state === 'cover') return;
      if (document.hidden) audio.pause(); else audio.play().catch(() => {});
    });
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
  $('openBtn').focus({ preventScroll: true });
})();
</script>
</body>
</html>
